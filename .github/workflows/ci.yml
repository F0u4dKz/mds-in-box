name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "dlt[duckdb]>=1.0" \
            "dbt-duckdb>=1.8" \
            "pytest>=8.0" \
            "shandy-sqlfmt[jinjafmt]>=0.21"

      - name: sqlfmt check
        run: sqlfmt --check dbt/models

      - name: dlt fixture integration tests
        run: pytest pipeline/tests -q

      - name: Seed CI raw warehouse from fixtures
        run: |
          mkdir -p warehouse
          DATA_DIR=ci/fixtures DUCKDB_PATH=warehouse/ci_raw.duckdb \
            python pipeline/olist_pipeline.py

      - name: dbt deps + build (run and test)
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir . --target ci
